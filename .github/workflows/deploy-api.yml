name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'

jobs:
  build-deploy:
    name: Build & Deploy Lambda Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter api exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter api test

      - name: Bundle Lambda functions
        run: pnpm --filter api build

      - name: Zip bundles
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip -r "handler.zip" handler.js)
            echo "Zipped $name"
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda functions
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            aws lambda update-function-code \
              --function-name "portfolio-${name}" \
              --zip-file "fileb://${fn}handler.zip"
            echo "Deployed portfolio-${name}"
          done
