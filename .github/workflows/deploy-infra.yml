name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**']
  pull_request:
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'plan (dry-run) or apply (make changes)'
        type: choice
        options: [plan, apply]
        default: plan

# Least-privilege by default. Only the credentialed jobs opt into id-token.
permissions:
  contents: read

env:
  TF_VERSION: '1.9.8'
  AWS_REGION: us-east-1

jobs:
  # PR checks: format + validate ONLY — no AWS credentials, no backend, no
  # `terraform plan`. This is deliberate (issue #102): a credentialed plan on a
  # pull_request would run PR-controlled HCL (data "external", module/provider
  # sources) with the broad Terraform role. Validation runs offline against
  # PR-controlled config with no secrets in scope, so there's nothing to abuse
  # and no plan output to inject into a PR comment.
  validate:
    name: Terraform Validate (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      # Lambda bundles must exist so source_code_hash expressions resolve during
      # validate. This builds PR code with NO credentials (same as the test jobs).
      - name: Bundle Lambda functions
        run: pnpm --filter api build
        working-directory: ${{ github.workspace }}

      - name: Zip Lambda bundles
        working-directory: ${{ github.workspace }}
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip handler.zip handler.js)
            echo "zipped $name"
          done

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -backend=false
      - run: terraform fmt -check -recursive
      - run: terraform validate

  # Credentialed plan: only on push to main (post-merge, trusted code) and on a
  # manual "plan" dispatch — never on a pull_request. Output goes to the log.
  plan:
    name: Terraform Plan
    if: (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Feeds var.anthropic_api_key → the chatbot Lambda's ANTHROPIC_API_KEY.
      # Sensitive, so Terraform redacts it from plan output.
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Feeds var.turnstile_secret_key → the contact Lambda's TURNSTILE_SECRET_KEY.
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Bundle Lambda functions
        run: pnpm --filter api build
        working-directory: ${{ github.workspace }}

      - name: Zip Lambda bundles
        working-directory: ${{ github.workspace }}
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip handler.zip handler.js)
            echo "zipped $name"
          done

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform plan -var-file=environments/prod/terraform.tfvars -no-color

  # Only runs on an explicit manual "apply" dispatch from the main branch.
  # Infrastructure is never changed automatically on push — apply is a
  # deliberate, human-triggered step.
  apply:
    name: Terraform Apply (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Feeds var.anthropic_api_key → the chatbot Lambda's ANTHROPIC_API_KEY.
      TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Feeds var.turnstile_secret_key → the contact Lambda's TURNSTILE_SECRET_KEY.
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Bundle Lambda functions
        run: pnpm --filter api build
        working-directory: ${{ github.workspace }}

      - name: Zip Lambda bundles
        working-directory: ${{ github.workspace }}
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip handler.zip handler.js)
            echo "zipped $name"
          done

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform apply -var-file=environments/prod/terraform.tfvars -auto-approve
