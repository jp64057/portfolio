name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**']
  pull_request:
    paths: ['infra/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'plan (dry-run) or apply (make changes)'
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write   # Required for OIDC
  contents: read
  pull-requests: write  # Required to post plan comments

env:
  TF_VERSION: '1.9.8'
  AWS_REGION: us-east-1

jobs:
  # Runs on every push/PR to infra/**, and on a manual "plan" dispatch.
  # Never changes infrastructure — plan/dry-run only.
  plan:
    name: Terraform Plan
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Bundle Lambda functions
        run: pnpm --filter api build
        working-directory: ${{ github.workspace }}

      - name: Zip Lambda bundles
        working-directory: ${{ github.workspace }}
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip handler.zip handler.js)
            echo "zipped $name"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - id: plan
        run: terraform plan -var-file=environments/prod/terraform.tfvars -no-color -out=tfplan
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Only runs on an explicit manual "apply" dispatch from the main branch.
  # Infrastructure is never changed automatically on push — apply is a
  # deliberate, human-triggered step.
  apply:
    name: Terraform Apply (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Bundle Lambda functions
        run: pnpm --filter api build
        working-directory: ${{ github.workspace }}

      - name: Zip Lambda bundles
        working-directory: ${{ github.workspace }}
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip handler.zip handler.js)
            echo "zipped $name"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform apply -var-file=environments/prod/terraform.tfvars -auto-approve
