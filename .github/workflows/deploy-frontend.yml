name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & type-check
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build
        env:
          # The frontend calls /api/* which CloudFront routes to API Gateway,
          # so no absolute URL is needed in production. Set this for local dev.
          NEXT_PUBLIC_API_URL: ''
          # Cloudflare Turnstile site key, baked into the static bundle at build.
          # Empty (variable unset) → the component falls back to CF's public test
          # site key. Public value, so a repo *variable*, not a secret.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Immutable assets — versioned filenames, safe to cache for 1 year
          aws s3 sync apps/web/out/_next/static \
            s3://${{ secrets.S3_BUCKET }}/_next/static \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          # HTML, JSON, and everything else — always revalidate
          aws s3 sync apps/web/out \
            s3://${{ secrets.S3_BUCKET }} \
            --cache-control "public,no-cache" \
            --exclude "_next/static/*" \
            --delete

      - name: Set image/png on generated OG cards
        # Next emits the metadata image routes as extensionless files
        # (opengraph-image, twitter-image, …); `aws s3 sync` can't infer their
        # type, so social scrapers would see octet-stream. Re-upload the local
        # build outputs with the right type. (Uploading from disk needs only
        # PutObject — the deploy role has no GetObject, so a copy-in-place with
        # --metadata-directive REPLACE would 403 on HeadObject.)
        run: |
          for key in opengraph-image twitter-image stats/opengraph-image stats/twitter-image; do
            aws s3 cp "apps/web/out/$key" "s3://${{ secrets.S3_BUCKET }}/$key" \
              --content-type image/png \
              --cache-control "public,max-age=3600"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
