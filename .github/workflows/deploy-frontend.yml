name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & type-check
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build
        env:
          # The frontend calls /api/* which CloudFront routes to API Gateway,
          # so no absolute URL is needed in production. Set this for local dev.
          NEXT_PUBLIC_API_URL: ''

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Immutable assets — versioned filenames, safe to cache for 1 year
          aws s3 sync apps/web/out/_next/static \
            s3://${{ secrets.S3_BUCKET }}/_next/static \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          # HTML, JSON, and everything else — always revalidate
          aws s3 sync apps/web/out \
            s3://${{ secrets.S3_BUCKET }} \
            --cache-control "public,no-cache" \
            --exclude "_next/static/*" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
