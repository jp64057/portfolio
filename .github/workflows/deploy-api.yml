name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'

jobs:
  build-deploy:
    name: Build & Deploy Lambda Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter api exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter api test

      - name: Bundle Lambda functions
        run: pnpm --filter api build

      - name: Zip bundles
        run: |
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            (cd "$fn" && zip -r "handler.zip" handler.js)
            echo "Zipped $name"
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda functions
        run: |
          # Deploy code to each bundled function. A function that doesn't exist
          # yet (a newly added Lambda not applied by deploy-infra) surfaces as a
          # ResourceNotFoundException — tolerate it with a warning instead of
          # failing the whole run, so the create-then-deploy ordering isn't a
          # red build. Any other error still fails the job.
          # (Uses only lambda:UpdateFunctionCode — the deploy role has no
          # GetFunction, so we can't pre-check existence; we react to the error.)
          skipped=()
          for fn in api/dist/*/; do
            name=$(basename "$fn")
            fname="portfolio-${name}"
            if out=$(aws lambda update-function-code \
                       --function-name "$fname" \
                       --zip-file "fileb://${fn}handler.zip" 2>&1); then
              echo "Deployed $fname"
            elif grep -q 'ResourceNotFoundException' <<<"$out"; then
              echo "::warning::$fname does not exist yet — skipping code deploy. Create it via the deploy-infra 'apply' workflow, then re-run this job."
              skipped+=("$fname")
            else
              echo "$out" >&2
              echo "::error::Failed to deploy $fname"
              exit 1
            fi
          done
          if [ ${#skipped[@]} -gt 0 ]; then
            echo "Note: skipped ${#skipped[@]} not-yet-created function(s): ${skipped[*]}"
          fi
